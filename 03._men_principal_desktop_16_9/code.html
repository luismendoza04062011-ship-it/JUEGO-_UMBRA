<script data-purpose="spore-particles">
    // Atmospheric glowing ember/spore particles canvas animation
    (function initSpores() {
      const canvas = document.getElementById('sporesCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const spores = [];
      const sporeCount = Math.floor(Math.min(width, 1920) / 22);

      class Spore {
        constructor() {
          this.reset(true);
        }
        reset(init = false) {
          this.x = Math.random() * width;
          this.y = init ? Math.random() * height : height + 10;
          this.size = Math.random() * 2.8 + 0.8;
          this.speedY = Math.random() * 0.45 + 0.15;
          this.speedX = (Math.random() - 0.45) * 0.35;
          this.opacity = Math.random() * 0.75 + 0.2;
          this.colorType = Math.random() > 0.45 ? 'amber' : 'teal';
          this.pulse = Math.random() * Math.PI;
          this.pulseSpeed = 0.02 + Math.random() * 0.03;
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX + Math.sin(this.pulse) * 0.2;
          this.pulse += this.pulseSpeed;

          if (this.y < -15 || this.x < -20 || this.x > width + 20) {
            this.reset(false);
          }
        }
        draw() {
          const currentAlpha = (Math.sin(this.pulse) * 0.3 + 0.7) * this.opacity;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

          if (this.colorType === 'amber') {
            ctx.fillStyle = `rgba(245, 178, 56, ${currentAlpha})`;
            ctx.shadowColor = 'rgba(245, 158, 11, 0.7)';
          } else {
            ctx.fillStyle = `rgba(45, 212, 191, ${currentAlpha})`;
            ctx.shadowColor = 'rgba(45, 212, 191, 0.7)';
          }
          ctx.shadowBlur = 9;
          ctx.fill();
        }
      }

      for (let i = 0; i < sporeCount; i++) {
        spores.push(new Spore());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < spores.length; i++) {
          spores[i].update();
          spores[i].draw();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
<script data-purpose="menu-keyboard-navigation">
    // Metroidvania Keyboard Menu Interaction (Up/Down arrow keys & Enter)
    (function setupMenuNavigation() {
      const menuItems = Array.from(document.querySelectorAll('.menu-item'));
      let currentIndex = 0;

      function updateActiveItem(index) {
        menuItems.forEach((btn, i) => {
          if (i === index) {
            btn.classList.add('active');
            btn.focus();
          } else {
            btn.classList.remove('active');
          }
        });
      }

      menuItems.forEach((item, index) => {
        item.addEventListener('mouseenter', () => {
          currentIndex = index;
          updateActiveItem(currentIndex);
        });

        item.addEventListener('click', () => {
          // Visual click feedback
          item.classList.add('scale-105');
          setTimeout(() => item.classList.remove('scale-105'), 180);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          e.preventDefault();
          currentIndex = (currentIndex + 1) % menuItems.length;
          updateActiveItem(currentIndex);
        } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          currentIndex = (currentIndex - 1 + menuItems.length) % menuItems.length;
          updateActiveItem(currentIndex);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (menuItems[currentIndex]) {
            menuItems[currentIndex].click();
          }
        }
      });
    })();
  </script>
