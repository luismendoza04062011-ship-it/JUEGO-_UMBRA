<!DOCTYPE html>

<html class="h-full w-full overflow-hidden select-none" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>09. Gameplay Móvil Horizontal - Combate y Poderes</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cavern-dark': '#0b0f12',
            'cyan-glow': '#26f0d2',
            'cyan-core': '#7df9e2',
            'amber-energy': '#f59e0b',
            'amber-rune': '#fbbf24',
            'life-red': '#f43f5e',
            'coral-hazard': '#ef4444'
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif', 'system-ui'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'cyan-pulse': '0 0 15px rgba(38, 240, 210, 0.45)',
            'amber-pulse': '0 0 14px rgba(245, 158, 11, 0.55)',
            'radial-rim': 'inset 0 0 10px rgba(255,255,255,0.2), 0 4px 12px rgba(0,0,0,0.6)'
          }
        }
      }
    }
  </script>
<!-- Google Fonts for runic/atmospheric fantasy style -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Core Layout Styles -->
<style data-purpose="core-layout">
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Strict 844x390 aspect viewport container with responsive scaling fit */
    .mobile-frame {
      width: 844px;
      height: 390px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
    }

    @media (max-width: 844px), (max-height: 390px) {
      .mobile-frame {
        transform: translate(-50%, -50%) scale(calc(min(100vw / 844, 100vh / 390)));
        transform-origin: center center;
      }
    }
  </style>
<!-- HUD & Touch Control Styling -->
<style data-purpose="hud-styling">
    .rune-glass {
      background: linear-gradient(135deg, rgba(16, 26, 31, 0.72) 0%, rgba(8, 14, 18, 0.85) 100%);
      border: 1.5px solid rgba(38, 240, 210, 0.35);
      backdrop-filter: blur(4px);
    }
    
    .rune-glass-amber {
      background: linear-gradient(135deg, rgba(35, 23, 10, 0.75) 0%, rgba(18, 12, 6, 0.88) 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      backdrop-filter: blur(4px);
    }

    .touch-btn {
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .touch-btn:active, .touch-btn-pressed {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    /* Ambient pulse on glowing elements */
    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #26f0d2); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #7df9e2); }
    }
    .glow-effect {
      animation: glowPulse 2.8s infinite ease-in-out;
    }
    
    /* Healing ring progress ring stroke */
    .healing-ring {
      stroke-dasharray: 188;
      stroke-dashoffset: 65;
      transform: rotate(-90deg);
      transform-origin: center;
    }
  </style>
</head>
<body class="bg-black text-slate-100 flex items-center justify-center font-sans">
<!-- BEGIN: GameViewContainer -->
<main class="mobile-frame relative bg-[#070b0e] shadow-2xl overflow-hidden border border-cyan-900/30" data-purpose="gameplay-canvas-wrapper">
<!-- BEGIN: Background Combat Artwork -->
<!-- Background layer using the provided 16:9 2D metroidvania combat battle art -->
<div class="absolute inset-0 w-full h-full z-0 overflow-hidden" data-purpose="combat-scene-visual">
<img alt="Lúmen combatiendo en la caverna fúngica contra Escarabajo de Ceniza y Centinela Hueco" class="w-full h-full object-cover object-center pointer-events-none scale-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0TFRGNn68wmJLeS9V7CPfQK5E5PUNnB9TxKTYwNpQSMNlePPjayrmQMPDGEHsbGP5yBhhUZioSb2mliUUl_5uaZkarVEJFRHlgQRMmfHaZAjl36t8K4rpQ-oJHEpDuNcqUh6q4y9hgam2viFBRiWtZEj7TypE4VPVz-aZzxEIH18-PhzIBLhc9Bh5UUHjE4J74Cuv_b53FpNLHb4NaPpIea_kYN8rYkU1z4ixn-8liV66skXNf-7mnw"/>
<!-- Subtle top and bottom safe-zone ambient vignettes -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/70 pointer-events-none"></div>
<div class="absolute inset-0 bg-radial from-transparent via-transparent to-black/40 pointer-events-none"></div>
</div>
<!-- END: Background Combat Artwork -->
<!-- BEGIN: TopHUD -->
<!-- Safe Area Top Bar (iOS Landscape safe zones ~44px left/right margins) -->
<header class="absolute top-2 left-6 right-6 z-20 flex justify-between items-start pointer-events-none" data-purpose="mobile-top-hud">
<!-- HUD Izquierda: Salud y Medidor de Energía Ancestral -->
<div class="flex flex-col gap-1 pointer-events-auto" data-purpose="player-vitals">
<!-- Contenedor Cristales de Salud Tallados -->
<div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg rune-glass bg-slate-900/70 border border-teal-500/40 shadow-lg">
<span class="text-[9px] font-bold font-cinzel text-teal-300 mr-1 tracking-wider">SALUD</span>
<!-- Cristal 1: Lleno -->
<div class="w-4 h-6 relative flex items-center justify-center">
<svg class="w-full h-full text-emerald-400 drop-shadow-[0_0_4px_#34d399]" fill="currentColor" viewbox="0 0 24 36">
<polygon points="12,1 23,8 23,26 12,35 1,26 1,8"></polygon>
<polygon fill="#a7f3d0" opacity="0.6" points="12,4 20,9 12,24"></polygon>
</svg>
</div>
<!-- Cristal 2: Lleno -->
<div class="w-4 h-6 relative flex items-center justify-center">
<svg class="w-full h-full text-emerald-400 drop-shadow-[0_0_4px_#34d399]" fill="currentColor" viewbox="0 0 24 36">
<polygon points="12,1 23,8 23,26 12,35 1,26 1,8"></polygon>
<polygon fill="#a7f3d0" opacity="0.6" points="12,4 20,9 12,24"></polygon>
</svg>
</div>
<!-- Cristal 3: Lleno -->
<div class="w-4 h-6 relative flex items-center justify-center">
<svg class="w-full h-full text-emerald-400 drop-shadow-[0_0_4px_#34d399]" fill="currentColor" viewbox="0 0 24 36">
<polygon points="12,1 23,8 23,26 12,35 1,26 1,8"></polygon>
<polygon fill="#a7f3d0" opacity="0.6" points="12,4 20,9 12,24"></polygon>
</svg>
</div>
<!-- Cristal 4: Lleno -->
<div class="w-4 h-6 relative flex items-center justify-center">
<svg class="w-full h-full text-emerald-400 drop-shadow-[0_0_4px_#34d399]" fill="currentColor" viewbox="0 0 24 36">
<polygon points="12,1 23,8 23,26 12,35 1,26 1,8"></polygon>
<polygon fill="#a7f3d0" opacity="0.6" points="12,4 20,9 12,24"></polygon>
</svg>
</div>
<!-- Cristal 5: Agrietado / Dañado -->
<div class="w-4 h-6 relative flex items-center justify-center opacity-65">
<svg class="w-full h-full text-slate-600" fill="currentColor" viewbox="0 0 24 36">
<polygon points="12,1 23,8 23,26 12,35 1,26 1,8"></polygon>
<!-- Grieta tallada -->
<path d="M12,5 L10,14 L15,19 L11,30" fill="none" stroke="#f43f5e" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Medidor Curvo de Energía Ancestral Cian (70%) -->
<div class="flex items-center gap-1.5 ml-1" data-purpose="ancestral-energy-gauge">
<div class="w-36 h-2.5 bg-slate-950/80 rounded-full border border-cyan-400/50 p-0.5 overflow-hidden shadow-cyan-pulse flex items-center">
<div class="h-full bg-gradient-to-r from-teal-500 via-cyan-400 to-cyan-200 rounded-full w-[70%] relative glow-effect">
<div class="absolute right-0 top-0 bottom-0 w-1.5 bg-white rounded-full"></div>
</div>
</div>
<span class="text-[9px] font-bold text-cyan-300 font-cinzel drop-shadow">70%</span>
</div>
</div>
<!-- HUD Centro: Poder Equipado (Pulso de Raíz) con Cambio Rápido -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full rune-glass shadow-lg pointer-events-auto border border-cyan-500/40" data-purpose="spell-status-center">
<!-- Ícono del poder -->
<div class="w-7 h-7 rounded-full bg-teal-950/80 border border-teal-400 flex items-center justify-center shadow-cyan-pulse">
<svg class="w-4 h-4 text-cyan-300" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
</svg>
</div>
<!-- Información de texto -->
<div class="flex flex-col leading-none">
<span class="text-[10px] font-cinzel font-extrabold text-teal-200 tracking-wider">PULSO DE RAÍZ</span>
<span class="text-[8px] text-cyan-400/90 font-medium">COSTE: 25 ENERGÍA</span>
</div>
<!-- Botón circular pequeño de cambio rápido -->
<button class="touch-btn ml-1 w-6 h-6 rounded-full bg-slate-800/90 border border-cyan-400/60 text-[9px] font-cinzel font-bold text-cyan-300 hover:text-white flex items-center justify-center shadow" title="Cambiar Poder">
          Q
        </button>
</div>
<!-- HUD Derecha: Esquirlas, Botón de Mapa [M] y Pausa [II] -->
<div class="flex items-center gap-2 pointer-events-auto" data-purpose="hud-system-resources">
<!-- Contador de Esquirlas Ancestrales -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg rune-glass-amber border border-amber-500/40 shadow-amber-pulse">
<span class="text-amber-400 text-xs drop-shadow">✦</span>
<span class="text-xs font-cinzel font-bold text-amber-200 tracking-wider">1,480</span>
</div>
<!-- Botón táctil circular Mapa [M] -->
<button aria-label="Abrir Mapa" class="touch-btn w-8 h-8 rounded-full rune-glass border border-cyan-500/50 flex items-center justify-center text-cyan-300 shadow">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
<line x1="8" x2="8" y1="2" y2="18"></line>
<line x1="16" x2="16" y1="6" y2="22"></line>
</svg>
</button>
<!-- Botón táctil circular Pausa [II] -->
<button aria-label="Menú Pausa" class="touch-btn w-8 h-8 rounded-full rune-glass border border-cyan-500/50 flex items-center justify-center text-cyan-300 shadow">
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 24 24">
<rect height="16" rx="1.5" width="4" x="6" y="4"></rect>
<rect height="16" rx="1.5" width="4" x="14" y="4"></rect>
</svg>
</button>
</div>
</header>
<!-- END: TopHUD -->
<!-- BEGIN: ContextualPrompts -->
<!-- Botón flotante contextual central para interactuar sin obstruir combates -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 pointer-events-auto" data-purpose="contextual-action">
<button class="touch-btn flex items-center gap-2 px-3 py-1.5 rounded-full rune-glass border border-amber-400/60 shadow-[0_0_12px_rgba(251,191,36,0.3)] text-amber-200 text-xs font-cinzel font-semibold backdrop-blur-md">
<span class="w-5 h-5 rounded-full bg-amber-500/30 border border-amber-300 flex items-center justify-center text-[10px] text-amber-100 font-bold">E</span>
<span>EXAMINAR / HABLAR</span>
</button>
</div>
<!-- END: ContextualPrompts -->
<!-- BEGIN: LeftTouchControls -->
<!-- Zona Pulgar Izquierdo: Joystick / D-Pad y Deslizarse -->
<div class="absolute bottom-4 left-6 z-20 w-44 h-44 flex flex-col justify-end pointer-events-auto" data-purpose="movement-controls">
<!-- Virtual Analog D-Pad Joystick -->
<div class="relative w-36 h-36 mx-auto flex items-center justify-center">
<!-- Outer Bioluminescent Ring with Runic Notches -->
<div class="w-36 h-36 rounded-full border-2 border-cyan-400/40 bg-slate-950/45 backdrop-blur-[2px] shadow-cyan-pulse flex items-center justify-center relative">
<!-- Directional indicators -->
<div class="absolute top-1.5 text-cyan-400/70 text-xs font-bold font-cinzel">▲</div>
<div class="absolute bottom-1.5 text-cyan-400/70 text-xs font-bold font-cinzel">▼</div>
<div class="absolute left-2 text-cyan-400/70 text-xs font-bold font-cinzel">◀</div>
<div class="absolute right-2 text-cyan-400/70 text-xs font-bold font-cinzel">▶</div>
<!-- Thumb Stick / Runic Central Knob -->
<div class="w-16 h-16 rounded-full bg-gradient-to-b from-teal-900/80 to-slate-900/90 border-2 border-cyan-300 shadow-[inset_0_0_12px_rgba(38,240,210,0.6),0_4px_10px_rgba(0,0,0,0.8)] flex items-center justify-center transform -translate-x-1.5 -translate-y-2 cursor-pointer touch-btn">
<div class="w-6 h-6 rounded-full border border-teal-200/50 bg-teal-500/20 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-cyan-200 shadow-[0_0_8px_#fff]"></div>
</div>
</div>
</div>
</div>
<!-- Botón Agacharse / Deslizarse (justo debajo e izquierda) -->
<button aria-label="Deslizarse o Agacharse" class="touch-btn -mt-2 -ml-2 w-11 h-11 rounded-full rune-glass border border-cyan-500/40 flex items-center justify-center shadow-lg active:border-cyan-300" data-purpose="crouch-slide-action">
<svg class="w-5 h-5 text-cyan-200 drop-shadow" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<!-- Silueta de deslizamiento / crouching -->
<circle cx="9" cy="6" r="2.5"></circle>
<path d="M4 19 L9 15 L14 17 L20 12"></path>
<path d="M9 15 L11 10 L15 11"></path>
</svg>
</button>
</div>
<!-- END: LeftTouchControls -->
<!-- BEGIN: RightTouchControls -->
<!-- Zona Pulgar Derecho: Ergonomía radial de combate de alta intensidad -->
<div class="absolute bottom-3 right-5 z-20 w-64 h-64 pointer-events-auto" data-purpose="combat-action-cluster">
<div class="relative w-full h-full">
<!-- 1. Botón Dominante Principal: ATAQUE DE ESPADA (Grande, centro radial) -->
<button aria-label="Ataque de Espada" class="touch-btn absolute right-16 bottom-14 w-20 h-20 rounded-full bg-gradient-to-br from-teal-950/90 via-slate-900/95 to-slate-950/95 border-2 border-cyan-400 shadow-[0_0_20px_rgba(38,240,210,0.5),inset_0_0_12px_rgba(38,240,210,0.4)] flex flex-col items-center justify-center z-20 group" data-purpose="primary-sword-attack">
<!-- Crystalline Sword Icon -->
<svg class="w-10 h-10 text-cyan-200 drop-shadow-[0_0_8px_#26f0d2] transform -rotate-45" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
<line x1="13" x2="19" y1="19" y2="13"></line>
<line x1="16" x2="20" y1="16" y2="20"></line>
<line x1="19" x2="21" y1="21" y2="19"></line>
</svg>
<span class="text-[8px] font-cinzel font-bold text-teal-300 tracking-wider -mt-1">ATACAR</span>
</button>
<!-- 2. Botón de SALTO (Estado activo presionado / fulgor brillante) -->
<button aria-label="Salto" class="touch-btn touch-btn-pressed absolute right-1 bottom-3 w-14 h-14 rounded-full bg-gradient-to-br from-cyan-600/80 to-teal-950/90 border-2 border-cyan-200 shadow-[0_0_18px_rgba(125,249,226,0.8),inset_0_0_8px_#ffffff] flex flex-col items-center justify-center z-10" data-purpose="jump-action">
<svg class="w-6 h-6 text-white drop-shadow-[0_0_6px_#ffffff]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="18 15 12 9 6 15"></polyline>
</svg>
<span class="text-[7.5px] font-cinzel font-bold text-white tracking-tight">SALTAR</span>
</button>
<!-- 3. Botón de DASH (Paso de Sombra) con indicador de recarga rápida -->
<button aria-label="Dash Paso de Sombra" class="touch-btn absolute right-36 bottom-3 w-13 h-13 p-2.5 rounded-full rune-glass border border-cyan-400/70 shadow-cyan-pulse flex flex-col items-center justify-center z-10" data-purpose="dash-action">
<svg class="w-6 h-6 text-cyan-300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
</svg>
<span class="text-[7px] font-cinzel font-bold text-cyan-200">DASH</span>
<!-- Anillo de cooldown listo -->
<div class="absolute inset-0 rounded-full border border-teal-300/40 border-t-teal-200 animate-spin" style="animation-duration: 4s;"></div>
</button>
<!-- 4. Botón de LANZAR PODER EQUIPADO (Pulso de Raíz activo, 25 EN) -->
<button aria-label="Lanzar Poder Activo" class="touch-btn absolute right-24 top-2 w-14 h-14 rounded-full bg-gradient-to-br from-teal-900/90 to-slate-900/90 border-2 border-teal-400 shadow-[0_0_14px_rgba(45,212,191,0.5)] flex flex-col items-center justify-center z-10" data-purpose="cast-spell-action">
<svg class="w-6 h-6 text-teal-300 drop-shadow-[0_0_5px_#2dd4bf]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
</svg>
<div class="flex items-center gap-0.5 -mt-0.5">
<span class="text-[7px] font-cinzel font-extrabold text-teal-200">PODER</span>
<span class="text-[6.5px] font-mono text-cyan-300">25</span>
</div>
</button>
<!-- 5. Botón Adyacente Pequeño: CAMBIAR PODER (Rotando con Destello Ancestral) -->
<button aria-label="Cambiar Poder Rápido" class="touch-btn absolute right-12 top-6 w-9 h-9 rounded-full rune-glass-amber border border-amber-400/80 shadow-amber-pulse flex items-center justify-center z-10" data-purpose="cycle-power-action">
<svg class="w-4 h-4 text-amber-300 drop-shadow" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
</svg>
</button>
<!-- 6. Botón de CURACIÓN "VÍNCULO VITAL" (Mantener pulsado con canalización radial de savia) -->
<div class="absolute right-40 top-14 w-12 h-12 z-10 flex items-center justify-center" data-purpose="vital-bond-heal-action">
<!-- Anillo radial SVG de canalización -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 48 48">
<circle cx="24" cy="24" fill="none" r="20" stroke="rgba(244,63,94,0.2)" stroke-width="3"></circle>
<circle class="healing-ring text-rose-500" cx="24" cy="24" fill="none" r="20" stroke="currentColor" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<button aria-label="Curación Vínculo Vital" class="touch-btn w-10 h-10 rounded-full bg-gradient-to-b from-rose-950/80 to-slate-950/90 border border-rose-400/80 shadow-[0_0_10px_rgba(244,63,94,0.5)] flex flex-col items-center justify-center">
<svg class="w-4 h-4 text-rose-300 drop-shadow-[0_0_4px_#f43f5e]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
</svg>
<span class="text-[6px] font-cinzel font-bold text-rose-200">CURAR</span>
</button>
</div>
</div>
</div>
<!-- END: RightTouchControls -->
<!-- BEGIN: InGameMinimapIndicator -->
<!-- Mini-indicador de salón actual en el rincón inferior derecho del fondo (sin solapar los botones) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 text-[9px] font-cinzel tracking-widest text-slate-400/50 uppercase pointer-events-none">
      Cámaras Profundas • Caverna Fúngica
    </div>
<!-- END: InGameMinimapIndicator -->
</main>
<!-- END: GameViewContainer -->
<!-- Small UI script for tactile touch feedback -->
<script data-purpose="touch-interactivity">
    document.querySelectorAll('.touch-btn').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        btn.classList.add('touch-btn-pressed');
      }, { passive: true });

      btn.addEventListener('touchend', () => {
        btn.classList.remove('touch-btn-pressed');
      }, { passive: true });
    });
  </script>
