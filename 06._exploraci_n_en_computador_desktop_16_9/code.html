<!DOCTYPE html>

<html class="h-full w-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UMBRA - Exploración</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: MedievalSharp and Cinzel for fantasy metroidvania UI -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Metrophobic&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            hud: ['Metrophobic', 'sans-serif'],
          },
          colors: {
            umbra: {
              turquoise: '#2bf6d9',
              turquoisedark: '#0a6458',
              amber: '#fca311',
              amberdark: '#6e4100',
              bark: '#231c15',
              rune: '#88f3df'
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Atmospheric CSS -->
<style data-purpose="hud-styling">
    /* Subtle pulsing animations for fantasy bioluminescence */
    @keyframes bioluminescentPulse {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(43, 246, 217, 0.75)) drop-shadow(0 0 14px rgba(43, 246, 217, 0.35));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(43, 246, 217, 0.95)) drop-shadow(0 0 24px rgba(43, 246, 217, 0.6));
      }
    }

    @keyframes shrineBeacon {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.9;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 1;
      }
    }

    .glow-turquoise {
      animation: bioluminescentPulse 3.5s infinite ease-in-out;
    }

    .beacon-interact {
      animation: shrineBeacon 2.6s infinite ease-in-out;
    }

    /* Textured dark fantasy border backgrounds */
    .stone-frame {
      background: linear-gradient(135deg, rgba(22, 28, 26, 0.88) 0%, rgba(11, 15, 14, 0.94) 100%);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(136, 243, 223, 0.22);
    }

    .key-cap {
      background: linear-gradient(180deg, #2e261f 0%, #15110d 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 4px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(252, 163, 17, 0.35);
    }
  </style>
<!-- END: Custom Atmospheric CSS -->
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden bg-black select-none text-slate-100 font-hud">
<!-- BEGIN: GameViewport -->
<main class="relative w-full h-full overflow-hidden flex items-center justify-center">
<!-- Background Layer: In-game full exploration screen -->
<div class="absolute inset-0 w-full h-full z-0 pointer-events-none">
<img alt="Hand-drawn 2D metroidvania side-scrolling gameplay screenshot. Lush bioluminescent subterranean forest called Bosque de Raíces Dormidas." class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsFN-d_zxY9wfFdosAStaB3hXbPcpx5Rlyyg73rF2AHK10jFmXRZjnsTbLdHDJBjFhF41QAZ8WOCfYoDNq8xRXmArqXfH_h6tUYvM08ToRqBmKYZxR-_Oz7N5mdFVZA-n2KxPEqllziCj3WTcf9VXGen0hjT-KRly2Wh_NJjWLeW13SBt1XIdxeyrzuHdwVQVK6u2wSxCWJKYlP3M5mAPEh0PP3LT3F5BqKyOU7BrU5M4qEn5fsu0GFg"/>
<!-- Vignette and color grading overlays for immersion -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40 pointer-events-none"></div>
<div class="absolute inset-0 ring-1 ring-inset ring-black/40 pointer-events-none"></div>
</div>
<!-- BEGIN: ContextualWorldMarker -->
<!-- In-world prompt placed next to the ancient resting shrine visible in the background -->
<div class="absolute left-[71.5%] top-[25%] beacon-interact z-10 pointer-events-auto" data-purpose="world-interaction-prompt">
<div class="flex items-center gap-2.5 px-3 py-1.5 rounded-full stone-frame backdrop-blur-md border border-umbra-amber/40 shadow-xl">
<span class="flex items-center justify-center w-6 h-6 text-xs font-bold text-amber-200 key-cap rounded">E</span>
<div class="flex flex-col">
<span class="text-xs uppercase tracking-wider font-cinzel font-semibold text-amber-300 drop-shadow">Examinar Brote</span>
<span class="text-[10px] text-amber-100/70 -mt-0.5">Descanso Ancestral</span>
</div>
<!-- Little pulsating glowing leaf or orb icon -->
<span class="relative flex h-2 w-2 ml-0.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-amber-300"></span>
</span>
</div>
</div>
<!-- END: ContextualWorldMarker -->
<!-- BEGIN: TopLeftHUD -->
<!-- Vital stats: Life crystals, Ancestral Energy, Shard Counter, and Skill -->
<header class="absolute top-6 left-6 z-20 flex flex-col gap-3" data-purpose="hud-vital-stats">
<!-- Primary Status Bar Cluster -->
<div class="flex items-start gap-3">
<!-- Lumen Portrait Sigil / Crest -->
<div class="relative w-14 h-14 rounded-full stone-frame flex items-center justify-center border border-umbra-turquoise/40 shadow-2xl">
<div class="absolute inset-0 rounded-full border border-umbra-turquoise/30 animate-pulse"></div>
<svg class="w-8 h-8 text-umbra-turquoise drop-shadow-[0_0_8px_rgba(43,246,217,0.8)]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 2L4 9v6l8 7 8-7V9l-8-7z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 6v12M8 10l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="flex flex-col gap-2 pt-0.5">
<!-- 5 Life Crystals of Lúmen (4 full turquoise glowing, 1 fragmented) -->
<div class="flex items-center gap-1.5" data-purpose="life-crystals">
<!-- Crystal 1 (Full) -->
<div class="relative w-6 h-8 flex items-center justify-center glow-turquoise">
<svg class="w-full h-full text-umbra-turquoise fill-umbra-turquoise/90" viewbox="0 0 24 32">
<polygon points="12,1 23,8 19,25 12,31 5,25 1,8" stroke="#103c37" stroke-width="1.5"></polygon>
<line opacity="0.6" stroke="#a7fff5" stroke-width="1" x1="12" x2="12" y1="1" y2="31"></line>
</svg>
</div>
<!-- Crystal 2 (Full) -->
<div class="relative w-6 h-8 flex items-center justify-center glow-turquoise">
<svg class="w-full h-full text-umbra-turquoise fill-umbra-turquoise/90" viewbox="0 0 24 32">
<polygon points="12,1 23,8 19,25 12,31 5,25 1,8" stroke="#103c37" stroke-width="1.5"></polygon>
<line opacity="0.6" stroke="#a7fff5" stroke-width="1" x1="12" x2="12" y1="1" y2="31"></line>
</svg>
</div>
<!-- Crystal 3 (Full) -->
<div class="relative w-6 h-8 flex items-center justify-center glow-turquoise">
<svg class="w-full h-full text-umbra-turquoise fill-umbra-turquoise/90" viewbox="0 0 24 32">
<polygon points="12,1 23,8 19,25 12,31 5,25 1,8" stroke="#103c37" stroke-width="1.5"></polygon>
<line opacity="0.6" stroke="#a7fff5" stroke-width="1" x1="12" x2="12" y1="1" y2="31"></line>
</svg>
</div>
<!-- Crystal 4 (Full) -->
<div class="relative w-6 h-8 flex items-center justify-center glow-turquoise">
<svg class="w-full h-full text-umbra-turquoise fill-umbra-turquoise/90" viewbox="0 0 24 32">
<polygon points="12,1 23,8 19,25 12,31 5,25 1,8" stroke="#103c37" stroke-width="1.5"></polygon>
<line opacity="0.6" stroke="#a7fff5" stroke-width="1" x1="12" x2="12" y1="1" y2="31"></line>
</svg>
</div>
<!-- Crystal 5 (Fragmented / Empty) -->
<div class="relative w-6 h-8 flex items-center justify-center opacity-40">
<svg class="w-full h-full text-slate-500 fill-slate-800/40" viewbox="0 0 24 32">
<polygon points="12,1 23,8 19,25 12,31 5,25 1,8" stroke="#374151" stroke-width="1.5"></polygon>
<!-- Cracked lines -->
<line stroke="#9ca3af" stroke-width="1" x1="12" x2="7" y1="6" y2="16"></line>
<line stroke="#9ca3af" stroke-width="0.8" x1="7" x2="14" y1="16" y2="23"></line>
</svg>
</div>
<!-- Life crystal count label -->
<span class="ml-2 font-cinzel text-xs text-umbra-turquoise/90 tracking-widest font-semibold drop-shadow">4/5</span>
</div>
<!-- Ancestral Amber Energy Bar (75%) -->
<div class="flex items-center gap-2" data-purpose="ancestral-energy">
<div class="w-44 h-2.5 rounded-full bg-black/70 p-0.5 border border-amber-900/60 shadow-inner flex items-center">
<div class="h-full rounded-full bg-gradient-to-r from-amber-600 via-amber-500 to-amber-300 w-3/4 shadow-[0_0_10px_rgba(252,163,17,0.7)]"></div>
</div>
<span class="text-[10px] font-cinzel text-amber-300 tracking-wider font-bold">75%</span>
</div>
</div>
</div>
<!-- Secondary Left Metrics: Shards + Equipped Ability -->
<div class="flex items-center gap-4 pl-1 mt-1">
<!-- Shard Counter (1,240 Esquirlas) -->
<div class="flex items-center gap-2 px-3 py-1 rounded stone-frame border border-cyan-500/20 backdrop-blur-sm">
<svg class="w-4 h-4 text-cyan-300 drop-shadow-[0_0_5px_rgba(43,246,217,0.8)]" fill="currentColor" viewbox="0 0 24 24">
<polygon points="12 2 17 9 14 22 10 22 7 9"></polygon>
</svg>
<span class="font-cinzel text-xs font-bold text-cyan-100 tracking-wide">1,240</span>
<span class="text-[10px] uppercase text-cyan-400/80 font-medium tracking-wider">Esquirlas</span>
</div>
<!-- Equipped Ability: Pulso de Raíz [Q] -->
<div class="flex items-center gap-2 px-3 py-1 rounded stone-frame border border-emerald-500/20 backdrop-blur-sm">
<span class="w-5 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded">Q</span>
<div class="flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-xs font-cinzel text-emerald-200 tracking-wide">Pulso de Raíz</span>
</div>
</div>
</div>
</header>
<!-- END: TopLeftHUD -->
<!-- BEGIN: TopRightHUD -->
<!-- Runic Minimap and System Controls -->
<aside class="absolute top-6 right-6 z-20 flex flex-col items-end gap-3" data-purpose="hud-minimap-controls">
<!-- Runic Minimap frame -->
<div class="relative w-40 h-28 stone-frame rounded-md p-2 flex flex-col justify-between overflow-hidden border border-teal-500/30">
<!-- Minimap Background decorative grid/runes -->
<div class="absolute inset-0 opacity-20 pointer-events-none flex items-center justify-center">
<svg class="w-full h-full text-umbra-turquoise" fill="none" stroke="currentColor" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="40" stroke-dasharray="3,3" stroke-width="0.5"></circle>
<circle cx="50" cy="50" r="24" stroke-width="0.5"></circle>
<line stroke-dasharray="2,2" stroke-width="0.5" x1="50" x2="50" y1="0" y2="100"></line>
<line stroke-dasharray="2,2" stroke-width="0.5" x1="0" x2="100" y1="50" y2="50"></line>
</svg>
</div>
<!-- Schematic Rooms Layout inside Minimap -->
<div class="relative z-10 w-full h-full flex items-center justify-center">
<div class="relative w-28 h-16">
<!-- Connected metroidvania rooms -->
<div class="absolute left-2 top-4 w-6 h-5 border border-teal-500/40 bg-teal-950/40 rounded-sm"></div>
<div class="absolute left-8 top-3 w-10 h-7 border-2 border-teal-300/80 bg-teal-900/60 rounded-sm shadow-[0_0_8px_rgba(43,246,217,0.3)]">
<!-- Player position pin inside active room -->
<span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-cyan-300 animate-ping"></span>
<span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-white"></span>
</div>
<div class="absolute left-18 top-6 w-8 h-5 border border-teal-500/40 bg-teal-950/40 rounded-sm"></div>
<!-- Shrine marker in minimap -->
<div class="absolute left-14 top-1 w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_4px_#fca311]"></div>
</div>
</div>
<!-- Minimap footer details -->
<div class="relative z-10 flex items-center justify-between text-[9px] font-cinzel text-teal-300/80 border-t border-teal-900/60 pt-1">
<span>SECTOR III</span>
<span class="text-amber-300 font-bold">● SANTUARIO</span>
</div>
</div>
<!-- System Hotkeys: [TAB] Mapa, [ESC] Pausa -->
<nav class="flex items-center gap-2" data-purpose="hud-system-keys">
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded stone-frame border border-white/10 text-xs">
<span class="key-cap px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-200">TAB</span>
<span class="font-cinzel text-slate-300 text-[11px] tracking-wider">Mapa</span>
</div>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded stone-frame border border-white/10 text-xs">
<span class="key-cap px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-200">ESC</span>
<span class="font-cinzel text-slate-300 text-[11px] tracking-wider">Pausa</span>
</div>
</nav>
</aside>
<!-- END: TopRightHUD -->
<!-- BEGIN: BottomLeftZoneLabel -->
<!-- Current location label and depth indicator -->
<footer class="absolute bottom-6 left-6 z-20 pointer-events-none" data-purpose="hud-location">
<div class="flex flex-col">
<div class="flex items-center gap-2 mb-0.5">
<span class="w-1.5 h-1.5 rounded-full bg-teal-400 shadow-[0_0_6px_#2bf6d9]"></span>
<p class="font-cinzel text-lg md:text-xl font-bold tracking-widest text-slate-100 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
            Bosque de Raíces Dormidas
          </p>
</div>
<div class="flex items-center gap-2 pl-3.5">
<span class="text-xs uppercase tracking-widest font-cinzel text-teal-300/80 font-semibold drop-shadow">
            Profundidad: -340m
          </span>
<span class="text-slate-600 text-xs">|</span>
<span class="text-[11px] tracking-wider text-slate-400 font-medium">Cripta del Silencio</span>
</div>
</div>
</footer>
<!-- END: BottomLeftZoneLabel -->
<!-- BEGIN: BottomCenterControls -->
<!-- Keyboard gameplay inputs bar -->
<nav class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 pointer-events-none" data-purpose="hud-gameplay-controls">
<div class="flex items-center gap-4 px-5 py-2 rounded-full stone-frame backdrop-blur-md border border-white/10 shadow-2xl">
<!-- [A][D] Moverse -->
<div class="flex items-center gap-1.5">
<div class="flex items-center gap-1">
<span class="w-5 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded">A</span>
<span class="w-5 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded">D</span>
</div>
<span class="text-xs text-slate-300 tracking-wide font-cinzel">Moverse</span>
</div>
<span class="w-1 h-1 rounded-full bg-slate-600"></span>
<!-- [ESPACIO] Salto Arbóreo -->
<div class="flex items-center gap-1.5">
<span class="px-2 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded tracking-wider">ESPACIO</span>
<span class="text-xs text-slate-300 tracking-wide font-cinzel">Salto Arbóreo</span>
</div>
<span class="w-1 h-1 rounded-full bg-slate-600"></span>
<!-- [SHIFT] Dash -->
<div class="flex items-center gap-1.5">
<span class="px-2 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded">SHIFT</span>
<span class="text-xs text-slate-300 tracking-wide font-cinzel">Dash</span>
</div>
<span class="w-1 h-1 rounded-full bg-slate-600"></span>
<!-- [J] Atacar -->
<div class="flex items-center gap-1.5">
<span class="w-5 h-5 flex items-center justify-center text-[10px] font-bold key-cap text-amber-200 rounded">J</span>
<span class="text-xs text-teal-200 tracking-wide font-cinzel font-semibold">Atacar</span>
</div>
</div>
</nav>
<!-- END: BottomCenterControls -->
</main>
<!-- END: GameViewport -->
</body></html>
